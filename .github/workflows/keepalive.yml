name: Keep-alive
# Render's free tier sleeps after 15 min without traffic (~1 min cold start). A light health ping every
# 10 min keeps the demo warm for reviewers: one service running all month is ~744 h, within the 750 free hours.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.APP_URL }}/api/health"
